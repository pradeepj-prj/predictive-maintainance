apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: preprocess-telemetry
  annotations:
    scenarios.ai.sap.com/id: "predictive-maintenance"
    scenarios.ai.sap.com/name: "Predictive Maintenance"
    scenarios.ai.sap.com/description: "Predictive maintenance ML pipeline"
    executables.ai.sap.com/id: "preprocess"
    executables.ai.sap.com/name: "Preprocess Telemetry"
    executables.ai.sap.com/description: "Load telemetry data, engineer features, save processed data"
    artifacts.ai.sap.com/telemetry-data.kind: "dataset"
    artifacts.ai.sap.com/processed-data.kind: "dataset"
  labels:
    scenarios.ai.sap.com/id: "predictive-maintenance"
    executables.ai.sap.com/id: "preprocess"
    ai.sap.com/version: "1.4.0"
spec:
  imagePullSecrets:
    - name: docker-pj
  entrypoint: main
  templates:
    - name: main
      metadata:
        labels:
          ai.sap.com/resourcePlan: starter
      inputs:
        artifacts:
          - name: telemetry-data
            path: /app/data/input
      outputs:
        artifacts:
          - name: processed-data
            path: /app/output
            globalName: processed-data
            archive:
              none: {}
      container:
        image: jpradeep1994/predictive-maintainance:v2.0
        command: ["python", "preprocess.py"]
        args:
          - "--source"
          - "csv"
          - "--input"
          - "/app/data/input"
          - "--output"
          - "/app/output"
          - "--test-size"
          - "0.2"
