apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: preprocess-telemetry
  annotations:
    scenarios.ai.sap.com/id: "predictive-maintenance"
    scenarios.ai.sap.com/name: "Predictive Maintenance"
    scenarios.ai.sap.com/description: "Predictive maintenance ML pipeline"
    executables.ai.sap.com/id: "preprocess"
    executables.ai.sap.com/name: "Preprocess Telemetry"
    executables.ai.sap.com/description: "Load telemetry data, engineer features, save processed data"
    artifacts.ai.sap.com/telemetry-data.kind: "dataset"
    artifacts.ai.sap.com/processed-data.kind: "dataset"
  labels:
    scenarios.ai.sap.com/id: "predictive-maintenance"
    executables.ai.sap.com/id: "preprocess"
    ai.sap.com/version: "2.0.0"
spec:
  imagePullSecrets:
    - name: docker-pj
  entrypoint: main
  arguments:
    parameters:
      - name: test_size
        description: "Proportion of data for test set (0.0-1.0)"
        default: "0.2"
      - name: engineered_only
        description: "Use only engineered features, not raw (true/false)"
        default: "false"
  templates:
    - name: main
      metadata:
        labels:
          ai.sap.com/resourcePlan: starter
      inputs:
        artifacts:
          - name: telemetry-data
            path: /app/data/input
      outputs:
        artifacts:
          - name: processed-data
            path: /app/output
            globalName: processed-data
            archive:
              none: {}
      container:
        image: jpradeep1994/predictive-maintainance:v2.1
        command:
          - "sh"
          - "-c"
          - |
            if [ "{{workflow.parameters.engineered_only}}" = "true" ]; then
              python preprocess.py --source csv --input /app/data/input --output /app/output --test-size {{workflow.parameters.test_size}} --engineered-only
            else
              python preprocess.py --source csv --input /app/data/input --output /app/output --test-size {{workflow.parameters.test_size}}
            fi
