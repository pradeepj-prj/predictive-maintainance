apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: evaluate-model
  annotations:
    scenarios.ai.sap.com/id: "predictive-maintenance"
    scenarios.ai.sap.com/name: "Predictive Maintenance"
    scenarios.ai.sap.com/description: "Predictive maintenance ML pipeline"
    executables.ai.sap.com/id: "evaluate"
    executables.ai.sap.com/name: "Evaluate Model"
    executables.ai.sap.com/description: "Evaluate trained model on test set"
    artifacts.ai.sap.com/test-data.kind: "dataset"
    artifacts.ai.sap.com/trained-model.kind: "model"
    artifacts.ai.sap.com/evaluation-results.kind: "dataset"
  labels:
    scenarios.ai.sap.com/id: "predictive-maintenance"
    executables.ai.sap.com/id: "evaluate"
    ai.sap.com/version: "1.0.0"
spec:
  imagePullSecrets:
    - name: docker-pj
  entrypoint: main
  arguments:
    parameters:
      - name: model_name
        description: "Name of the model for output files"
        default: "model"
  templates:
    - name: main
      metadata:
        labels:
          ai.sap.com/resourcePlan: starter
      inputs:
        artifacts:
          - name: trained-model
            path: /app/model
          - name: test-data
            path: /app/data/test
      outputs:
        artifacts:
          - name: evaluation-results
            path: /app/output
            globalName: evaluation-results
            archive:
              none: {}
      container:
        image: jpradeep1994/predictive-maintainance:v2.0
        command: ["python", "evaluate.py"]
        args:
          - "--model"
          - "/app/model"
          - "--test-data"
          - "/app/data/test"
          - "--output"
          - "/app/output"
          - "--model-name"
          - "{{workflow.parameters.model_name}}"
